training:
  scenes:
    - FloorPlan2
    - FloorPlan3
    - FloorPlan1
    - FloorPlan4
    - FloorPlan5
    - FloorPlan6
  num_episodes: 10000
  num_parallel_envs: 4  # number of concurrent environment rollouts per PPO update
  auto_cluster_run_id: true  # append cluster job id/rank to output/checkpoint dirs when detected
  run_id: null  # optional explicit run suffix; overrides auto_cluster_run_id
  print_every: 10
  checkpoint_every: 250
  output_dir: output
  checkpoint_dir: checkpoints
  resume_from: null  # path to a .pt checkpoint to resume from, or null
  target:
    mode: random  # random | fixed | cycle
    object_type: null  # used when mode=fixed
    cycle: null  # used when mode=cycle, e.g. ["Mug", "Apple"]
    candidates:
      - Mug
      - Bowl   # optional whitelist used by env, e.g. ["Mug", "Apple", "Bowl"]

env:
  target_object_embed_dim: 8
  base_resolution: [224, 224]
  success_distance: 1.5
  max_steps: 100
  max_sensing_budget: 1000000
  fixed_high_res: false
  action_set: full
  move_magnitude: 0.25
  rotate_degrees: 45.0
  look_degrees: 15.0
  visibility_distance: 4.
  seed: 42
  auto_success_on_goal: false
  randomize_object_spawn: True
  # controller_kwargs:
  #   platform: CloudRendering  # useful on headless cluster nodes
  #   port: 8200  # base port; parallel envs auto-offset (+env_idx)
  reward_cfg:
    step_penalty: 0.01
    sense_penalty: 0.01
    oversensing_penalty: 0.0
    bump_penalty: 0.05
    timeout_penalty: 0.5
    wrong_done_penalty : 2. 
    success_reward: 10.0
    distance_scale: 0.5

#curriculum:
  #enabled: true
  #sense_penalty_start: 0.0
  #sense_penalty_end: 0.02
  #oversensing_penalty_start: 0.0
  #oversensing_penalty_end: 0.08
  #warmup_episodes: 3000

agent:
  lr: 1.0e-4
  gamma: 0.99
  clip_eps: 0.1
  value_coef: 0.5
  entropy_coef: 0.05
  epochs: 8

model:
  hidden_dim: 512
  lstm_layers: 1

visual_encoder:
  model_name: dinov2_vitb14

wandb:
  enabled: true
  project: ai2thor-rl
  entity: r0kasb-epfl
  run_name: exp2

trajectory_logging:
  enabled: false          # set to true to write per-step CSV + scene layouts
  fields:
    position: true        # x, y, z
    rotation: true        # rotation_y, camera_horizon
    action: true          # action name
    downgrade: true       # resolution level
    sensing_budget: true  # remaining budget
    reward: true          # per-step reward

huggingface:
  repo_id: R0kasB/resaction-nav
  push: false
  push_every: 100  # episodes between hub pushes

training:
  scenes:
    - FloorPlan1
  num_episodes: 20
  num_parallel_envs: 1
  auto_cluster_run_id: false
  run_id: quick
  print_every: 1
  checkpoint_every: 10
  output_dir: output
  checkpoint_dir: checkpoints
  resume_from: null
  target:
    mode: random
    object_type: null
    cycle: null
    candidates: null

env:
  target_object_embed_dim: 8
  base_resolution: [64, 64]
  success_distance: 0.5
  max_steps: 50
  max_sensing_budget: 5
  move_magnitude: 0.25
  rotate_degrees: 45.0
  look_degrees: 15.0
  visibility_distance: 1.5
  seed: 42
  reward_cfg:
    step_penalty: 0.002
    sense_penalty: 0.02
    oversensing_penalty: 0.05
    bump_penalty: 0.03
    fail_penalty: 1.0
    success_reward: 5.0
    distance_scale: 0.01

agent:
  lr: 3.0e-4
  gamma: 0.99
  clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  epochs: 4

model:
  hidden_dim: 512
  lstm_layers: 1

visual_encoder:
  model_name: dinov2_vitb14

wandb:
  enabled: true
  project: ai2thor-rl
  entity: r0kasb-epfl
  run_name: quick-test

huggingface:
  repo_id: R0kasB/resaction-nav
  push: false
  push_every: 100
